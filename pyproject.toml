[project]
name = "gradetrack"
version = "0.1.0"
description = "Notenverwaltung für Studierende und Prüfungsamt: Flask-Web-App mit REST-API"
requires-python = ">=3.12"
authors = [
  { name = "Tobias Gehrke" },
  { name = "Pavel Kullmann" },
  { name = "Anastasia Rotermel" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.bandit]
# Geprüft wird der Anwendungscode. Tests nutzen bewusst assert und Demo-Passwörter.
exclude_dirs = ["tests", ".venv", "venv"]

[tool.mypy]
python_version = "3.14"
files = ["gradetrack.py"]
strict = true
plugins = ["pydantic.mypy"]
