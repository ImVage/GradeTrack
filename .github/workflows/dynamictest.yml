name: Dynamictest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Anwendungstests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Python einrichten (actions/setup-python v7.1.0)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"

      - name: Abhängigkeiten installieren (gepinnt, mit Hash-Prüfung)
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Tests ausführen
        run: python -m pytest -ra --junitxml=test-report.xml

      - name: Ergebnis zusammenfassen
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          bericht = Path("test-report.xml")
          if not bericht.exists():
              print("## Anwendungstests\nKein Testbericht erzeugt.")
              raise SystemExit
          suite = ET.parse(bericht).getroot().find("testsuite")
          gesamt = int(suite.get("tests"))
          fehler = int(suite.get("failures")) + int(suite.get("errors"))
          print(f"## Anwendungstests: {gesamt - fehler} von {gesamt} bestanden\n")
          print("| Test | Ergebnis |")
          print("|---|---|")
          for fall in suite.iter("testcase"):
              ergebnis = "❌" if fall.find("failure") is not None or fall.find("error") is not None else "✅"
              print(f"| `{fall.get('classname')}::{fall.get('name')}` | {ergebnis} |")
          EOF

      - name: Testbericht hochladen (actions/upload-artifact v7.0.2)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-report
          path: test-report.xml
          if-no-files-found: ignore
