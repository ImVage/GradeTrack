name: Code Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, Tag oder Commit, der geprüft wird (z. B. vulnerable)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Python einrichten (actions/setup-python v7.1.0)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"

      - name: Bandit installieren (gepinnt, mit Hash-Prüfung)
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Bandit ausführen
        run: |
          set +e
          bandit -c pyproject.toml -r . -f txt -o bandit-report.txt
          status=$?
          bandit -c pyproject.toml -r . -f json -o bandit-report.json -q
          set -e
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          funde = json.loads(Path("bandit-report.json").read_text())["results"]
          if not funde:
              print("## SAST (Bandit): keine Funde ✅")
          else:
              print(f"## SAST (Bandit): {len(funde)} Fund(e) ❌\n")
              print("| Schwere | Regel | Stelle | Beschreibung |")
              print("|---|---|---|---|")
              for f in sorted(funde, key=lambda f: ["HIGH", "MEDIUM", "LOW"].index(f["issue_severity"])):
                  print(
                      f"| {f['issue_severity'].title()} | {f['test_id']} | "
                      f"`{f['filename'].removeprefix('./')}:{f['line_number']}` | {f['issue_text']} |"
                  )
          EOF
          exit $status

      - name: Bericht hochladen (actions/upload-artifact v7.0.2)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bandit-report
          path: bandit-report.txt
          if-no-files-found: ignore

  secrets:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Checkout mit ganzer Git-History (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks über alle Commits ausführen
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo \
            --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact --no-banner --no-color \
            --report-format json --report-path /repo/gitleaks-report.json
          status=$?
          set -e
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          bericht = Path("gitleaks-report.json")
          funde = json.loads(bericht.read_text()) if bericht.exists() else []
          if not funde:
              print("## Secret Scanning (gitleaks): keine Funde ✅")
          else:
              print(f"## Secret Scanning (gitleaks): {len(funde)} Fund(e) ❌\n")
              print("Die Werte sind geschwärzt (`--redact`).\n")
              print("| Regel | Stelle | Commit |")
              print("|---|---|---|")
              for f in funde:
                  print(f"| {f['RuleID']} | `{f['File']}:{f['StartLine']}` | `{f['Commit'][:7]}` |")
          EOF
          exit $status

      - name: Bericht hochladen (actions/upload-artifact v7.0.2)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  types:
    name: Type Checker (mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Python einrichten (actions/setup-python v7.1.0)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"

      - name: Abhängigkeiten installieren (gepinnt, mit Hash-Prüfung)
        run: python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: mypy ausführen
        run: |
          set +e
          mypy --no-color-output --no-error-summary > mypy-report.txt
          status=$?
          set -e
          {
            if [ "$status" -eq 0 ]; then
              echo "## Type Checker (mypy --strict): keine Fehler ✅"
            else
              echo "## Type Checker (mypy --strict): $(grep -c ': error:' mypy-report.txt) Fehler ❌"
              echo
              echo '```'
              head -n 40 mypy-report.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Bericht hochladen (actions/upload-artifact v7.0.2)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mypy-report
          path: mypy-report.txt
          if-no-files-found: ignore
