name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinning:
    name: Versionen per SHA/Digest gepinnt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Actions und Docker-Images auf Pinning prüfen
        run: bash scripts/check-pinning.sh

  dependency-audit:
    name: Abhängigkeiten auf bekannte Lücken prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Python einrichten (actions/setup-python v7.1.0)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: pip-audit installieren (gepinnt, mit Hash-Prüfung)
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: requirements.txt mit pip-audit prüfen
        run: |
          set +e
          pip-audit -r requirements.txt --require-hashes --disable-pip \
            --progress-spinner off --format markdown --output pip-audit-report.md
          status=$?
          set -e
          {
            echo "## pip-audit"
            if [ -s pip-audit-report.md ]; then cat pip-audit-report.md; else echo "Keine bekannten Sicherheitslücken gefunden."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Report hochladen (actions/upload-artifact v7.0.2)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pip-audit-report
          path: pip-audit-report.md
          if-no-files-found: ignore

  sbom:
    name: SBOM erzeugen (CycloneDX)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Python einrichten (actions/setup-python v7.1.0)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: cyclonedx-bom installieren (gepinnt, mit Hash-Prüfung)
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: SBOM aus requirements.txt erzeugen und validieren
        run: |
          cyclonedx-py requirements requirements.txt \
            --pyproject pyproject.toml --of JSON --output-reproducible --validate \
            -o sbom.cdx.json
          {
            echo "## SBOM (CycloneDX)"
            echo "| Paket | Version |"
            echo "|---|---|"
            python -c "import json; [print(f\"| {c['name']} | {c['version']} |\") for c in json.load(open('sbom.cdx.json'))['components']]"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM hochladen (actions/upload-artifact v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
